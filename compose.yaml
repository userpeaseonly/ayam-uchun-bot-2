name: ayam-uchun-bot-2

services:
  bot:
    image: ${BOT_IMAGE:?Set BOT_IMAGE to the release image digest}
    init: true
    restart: unless-stopped
    env_file:
      - .env.runtime
    environment:
      DB_PATH: /data/bot_database.sqlite3
      LOG_FILE: ""
      WEB_HOST: 0.0.0.0
      MEDIA_PATH: /data/media
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./reports
        target: /app/reports
        bind:
          create_host_path: false
      - type: bind
        source: ./backups
        target: /backups
        bind:
          create_host_path: false
    stop_grace_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: caddy:2-alpine
    profiles: [web]
    restart: unless-stopped
    env_file:
      - path: .env.web
        required: false
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
